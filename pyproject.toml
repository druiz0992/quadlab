[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robotlab"
version = "0.1.0"
description = "Drone simulation lab for testing estimation and control algorithms"
requires-python = ">=3.12"
dependencies = ["numpy>=1.24", "scipy>=1.18", "matplotlib>=3.7", "rotorpy==3.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "black>=24", "mypy>=1.10"]
gazebo = ["rerun-sdk==0.24.1", "protobuf>=4.25,<6"]
# MuJoCo physics for bipeds (simulation/mujoco/, docs/9_bipeds.md).
mujoco = ["mujoco==3.17.0"]
# ONNX policy runner for bipeds (control/onnx_policy.py).
policies = ["onnxruntime==1.31.0"]

[project.scripts]
robotlab = "robotlab.cli.gazebo:main"
robotlab-gazebo = "robotlab.cli.gazebo:main"
robotlab-batch = "robotlab.cli.batch:main"
robotlab-magcal = "robotlab.cli.magcal:main"
robotlab-imucal = "robotlab.cli.imucal:main"
robotlab-replay = "robotlab.cli.replay:main"
robotlab-build-plugins = "robotlab.cli.build_plugins:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"robotlab.simulation.mujoco" = ["assets/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
files = ["src/robotlab", "tests"]
mypy_path = "src"
warn_unused_ignores = true

[[tool.mypy.overrides]]
# No type information: ROS-provided Gazebo bindings, RotorPy, MuJoCo, and
# SciPy (typed via the separate scipy-stubs package, not a dependency).
module = ["gz.*", "rotorpy.*", "mujoco.*", "onnxruntime.*", "scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# MuJoCo and ONNX Runtime ship only partial type information; treat them as Any.
module = ["mujoco", "mujoco.*", "onnxruntime", "onnxruntime.*"]
follow_imports = "skip"

