[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dronelab"
version = "0.1.0"
description = "Drone simulation lab for testing estimation and control algorithms"
requires-python = ">=3.12"
dependencies = ["numpy>=1.24", "scipy>=1.18", "matplotlib>=3.7", "rotorpy==3.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "black>=24", "mypy>=1.10"]
gazebo = ["rerun-sdk==0.24.1", "protobuf>=4.25,<6"]

[project.scripts]
dronelab = "dronelab.cli.gazebo:main"
dronelab-gazebo = "dronelab.cli.gazebo:main"
dronelab-batch = "dronelab.cli.batch:main"
dronelab-magcal = "dronelab.cli.magcal:main"
dronelab-imucal = "dronelab.cli.imucal:main"
dronelab-replay = "dronelab.cli.replay:main"
dronelab-build-plugins = "dronelab.cli.build_plugins:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
files = ["src/dronelab", "tests"]
mypy_path = "src"
warn_unused_ignores = true

[[tool.mypy.overrides]]
# No type information: ROS-provided Gazebo bindings, RotorPy, and SciPy
# (typed via the separate scipy-stubs package, not a dependency).
module = ["gz.*", "rotorpy.*", "scipy.*"]
ignore_missing_imports = true

